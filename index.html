<!doctype html>
<html lang="pl" data-theme="red">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;600;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <title>Szuria bez kompromisu | Moje media społecznościowe</title>

    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="background bg-red"></div>
    <div class="background bg-orange"></div>
    <div class="background bg-purple"></div>
    <div class="background bg-green"></div>

    <div class="container">
      <button class="color-btn">
        <ion-icon name="color-palette" class="btn-icon"></ion-icon>
      </button>

      <main class="main">
        <div class="img-box">
          <img
            src="img/profilowe.jpg"
            alt="Zdjęcie profilowe Szurii bez kompromisu"
            class="img-portrait"
          />
        </div>

        <div class="description-box">
          <h1 class="h1">Szuria bez kompromisu</h1>
          <p class="location">Prawicowa szuria w Twojej piwnicy!</p>
          <blockquote class="quote">
            „Być reakcjonistą to zrozumieć, iż prawdy nie wolno wyrzec się tylko
            z tego powodu, że nie ma ona możliwości zatriumfować.”
            &mdash;&nbsp;Nicolás Gómez Dávila
          </blockquote>
        </div>

        <ul class="link-list">
          <li class="link-item">
            <a href="https://x.com/SzuriaBezKomp" target="_blank"
              ><ion-icon name="logo-twitter" class="ion-icon"></ion-icon>
              <span>Twitter</span></a
            >
          </li>
          <li class="link-item">
            <a
              href="https://www.facebook.com/people/Szuria-bez-kompromisu/61558720313724/"
              target="_blank"
              ><ion-icon name="logo-facebook" class="ion-icon"></ion-icon>
              <span>Facebook</span></a
            >
          </li>
          <li class="link-item">
            <a
              href="https://drive.google.com/drive/folders/16IMDZ0pPJt807z9QqrGEy3y8oOo3Mng2?usp=drive_link"
              target="_blank"
              ><ion-icon name="logo-google" class="ion-icon"></ion-icon>
              <span>Dysk Google</span></a
            >
          </li>
          <li class="link-item">
            <a href="https://github.com/SzuriaBezKompromisu" target="_blank"
              ><ion-icon name="logo-github" class="ion-icon"></ion-icon>
              <span>GitHub</span></a
            >
          </li>
        </ul>
      </main>
    </div>

    <img
      src="img/Pius-polaroid.png"
      alt="Święty Pius Dziesiąty"
      class="img-polaroid img-pius"
    />
    <img
      src="img/Lefebvre-polaroid.png"
      alt="Arcybiskup Marcel Lefebvre"
      class="img-polaroid img-lefebvre"
    />
    <img
      src="img/Gio-polaroid.jpg"
      alt="Gio Scotti"
      class="img-polaroid img-gio"
    />
    <img
      src="img/Banka-polaroid.png"
      alt="Ksiądz Szymon Bańka"
      class="img-polaroid img-banka"
    />

    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
